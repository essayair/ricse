services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    networks:
      - backend

  api:
    image: ${API_IMAGE:-ricse-staging-api}:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        DEBIAN_MIRROR: http://mirrors.aliyun.com/debian
        DEBIAN_SECURITY_MIRROR: http://mirrors.aliyun.com/debian-security
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      WECHAT_TOKEN_SECRET: ${WECHAT_TOKEN_SECRET:-}
      ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-false}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_APPROVER_PASSWORD: ${SEED_APPROVER_PASSWORD}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD}
      CORS_ORIGIN: ${PUBLIC_URL}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_ENDPOINT: ${PUBLIC_HOST}
      MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT}
      MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-ricse-attachments}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - backend

  content-api:
    image: ${API_IMAGE:-ricse-staging-api}:${IMAGE_TAG:-local}
    restart: unless-stopped
    command: ["node", "apps/api/dist/src/content-main.js"]
    environment:
      NODE_ENV: production
      CONTENT_API_PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=8
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      CORS_ORIGIN: ${PUBLIC_URL}
      CONTENT_CORS_ORIGIN: ${CONTENT_CORS_ORIGIN:-}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_ENDPOINT: ${PUBLIC_HOST}
      MINIO_PUBLIC_PORT: ${MINIO_PUBLIC_PORT}
      MINIO_PUBLIC_USE_SSL: ${MINIO_PUBLIC_USE_SSL}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-ricse-attachments}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      WX_APPID: ${WX_APPID:-}
      WX_SECRET: ${WX_SECRET:-}
      WECHAT_TOKEN_SECRET: ${WECHAT_TOKEN_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    expose:
      - "3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api/v1/content-health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: ${CONTENT_API_MEMORY_LIMIT:-512m}
    cpus: ${CONTENT_API_CPU_LIMIT:-1.0}
    networks:
      - backend
      - egress

  content-worker:
    image: ${API_IMAGE:-ricse-staging-api}:${IMAGE_TAG:-local}
    restart: unless-stopped
    command: ["node", "apps/api/dist/src/worker-main.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=4
      REDIS_URL: redis://redis:6379
      CONTENT_WORKER_CONCURRENCY: ${CONTENT_WORKER_CONCURRENCY:-1}
      MARKET_SYNC_CRON: ${MARKET_SYNC_CRON:-0 6 * * *}
      NEWS_SYNC_CRON: ${NEWS_SYNC_CRON:-0 8,12,17 * * *}
      CONTENT_TIMEZONE: ${CONTENT_TIMEZONE:-Asia/Shanghai}
      GDELT_FALLBACK_DELAY_MS: ${GDELT_FALLBACK_DELAY_MS:-10500}
      NEWS_SOURCE_ALLOWED_HOSTS: ${NEWS_SOURCE_ALLOWED_HOSTS:-}
      CONTENT_SYNC_ON_STARTUP: ${CONTENT_SYNC_ON_STARTUP:-true}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      BAIINFO_AUTH: ${BAIINFO_AUTH:-}
      BAIINFO_COOKIE: ${BAIINFO_COOKIE:-}
      BAIINFO_USERNAME: ${BAIINFO_USERNAME:-}
      BAIINFO_PASSWORD: ${BAIINFO_PASSWORD:-}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-ricse-attachments}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: ${CONTENT_WORKER_MEMORY_LIMIT:-768m}
    cpus: ${CONTENT_WORKER_CPU_LIMIT:-1.0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - backend
      - egress

  web:
    image: ${WEB_IMAGE:-ricse-staging-web}:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
      content-api:
        condition: service_healthy
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - frontend
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
      NGINX_ENVSUBST_FILTER: PUBLIC_HOST
    volumes:
      - ./nginx/http.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${RICSE_HTTP_BIND:-127.0.0.1:8080}:80"
    depends_on:
      api:
        condition: service_healthy
      content-api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  frontend:
  egress:
  backend:
    internal: true
