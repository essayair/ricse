services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ricse
      POSTGRES_PASSWORD: ricse_dev
      POSTGRES_DB: ricse_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9003"
    ports:
      - "9002:9000"
      - "9003:9001"
    environment:
      MINIO_ROOT_USER: ricse
      MINIO_ROOT_PASSWORD: ricse_dev
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
